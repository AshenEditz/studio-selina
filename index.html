<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Selina AI - 3D Anime Companion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading -->
    <div id="loading">
        <div class="load-box">
            <div class="load-icon">✨</div>
            <div class="load-bar"><div id="loadFill"></div></div>
            <p id="loadText">Loading Selina...</p>
        </div>
    </div>

    <!-- App -->
    <div id="app" class="hide">
        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-icon">✨</span>
                <div>
                    <h1>Selina AI</h1>
                    <small>by Ashen Editz</small>
                </div>
            </div>
            <div id="status" class="status">
                <span class="dot"></span>
                <span id="statusText">Online</span>
            </div>
        </header>

        <!-- 3D World -->
        <main id="world">
            <canvas id="canvas"></canvas>
            
            <div class="controls">
                <div class="ctrl-group">
                    <button onclick="changeOutfit('blue')">👕</button>
                    <button onclick="changeOutfit('pink')">👗</button>
                    <button onclick="changeOutfit('purple')">🎓</button>
                    <button onclick="changeOutfit('cyan')">🤖</button>
                </div>
                <div class="ctrl-group">
                    <button onclick="changeScene('night')">🌃</button>
                    <button onclick="changeScene('day')">🌸</button>
                    <button onclick="changeScene('sunset')">🏖️</button>
                    <button onclick="changeScene('space')">🌌</button>
                </div>
            </div>
            
            <div class="emotion">
                <span id="emojiIcon">😊</span>
                <span id="emojiText">Happy</span>
            </div>
        </main>

        <!-- Chat -->
        <section id="chatBox">
            <div id="messages"></div>
        </section>

        <!-- Voice -->
        <footer>
            <div id="micStatus"></div>
            <button id="voiceBtn" class="voice-btn">
                <span id="voiceIcon">🎤</span>
                <span id="voiceLabel">Tap to Talk</span>
            </button>
            <div class="quick">
                <button onclick="quickTalk('hi')">👋 Hi</button>
                <button onclick="quickTalk('help')">📚 Help</button>
                <button onclick="quickTalk('joke')">😄 Joke</button>
                <button onclick="quickTalk('love')">💖 Love</button>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/controls/OrbitControls.js"></script>
    <script src="database.js"></script>
    <script src="world-engine.js"></script>
    <script src="ai-engine.js"></script>
    <script src="script.js"></script>
</body>
</html>
